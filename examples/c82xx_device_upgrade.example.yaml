target_version: "26.2"

# Optional SSH jump-host access for a Telnet console.
# Uncomment this block only when the console must be reached through a proxy.
# device:
#   connection:
#     proxy: true
# jump_host:
#   ip: 172.29.3.64
#   port: 2023
#   username: meraki
#   password: replace-me

image:
  destination: "bootflash:"
  skip_if_present: false
  source:
    protocol: scp
    path: /path/to/approved-iosxe-image.bin
    server:
      ip: 192.0.2.20
      username: scp-user
      password: replace-me

wan_interfaces:
  - Te0/0/8
  - Te0/0/9

timeouts:
  copy: 1800
  install: 600
  reboot: 1800
  rommon_monitor: 60
  rommon_grace: 900
  poll_interval: 15
  prompt: 180
  dhcp: 300
  wan_dhcp_grace: 60
  server_ping_attempts: 3
  server_ping_interval: 5
  server_ping_timeout: 2
  wan_internet_grace: 300
  wan_internet_poll_interval: 15
  internet_ping_timeout: 2
